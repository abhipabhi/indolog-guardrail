# The chatbot, with the guardrail beside it in ../guardrail, as one project for uv
# (https://docs.astral.sh/uv). `uv sync` installs both into .venv in this folder, with Python 3.11,
# at exactly the versions in uv.lock; ./start.sh and start.ps1 run it for you. The versions are the
# ones in requirements.txt, which stays for installing the chatbot alone with pip. The guardrail
# adds FastAPI, at the version its own pyproject.toml pins, and with its `otel` extra the exporter
# that sends its spans to Langfuse (app/langfuse_trace.py; README.md, "Your runs in Langfuse").
[project]
name = "guardrail-test-chatbot"
version = "0.1.0"
description = "A test chatbot for IndoLog's guardrail"
requires-python = "==3.11.*"
dependencies = [
    "streamlit",
    "httpx",
    "langchain-core",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-ollama",
    "langchain-openai",
    "guardrail[otel]",
    "langfuse",
]

[tool.uv]
package = false          # the app runs from this folder; only what it needs is installed
# requirements.txt, line for line: uv.lock holds these versions and no others.
constraint-dependencies = [
